name: releaser

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract-section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## ${TAG}" '
            $0 == tag { found = 1; next }
            found && /<!-- previous-version -->/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then echo "No section for ${TAG} in CHANGELOG.md"; exit 1; fi
          cat notes.md
      - name: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
