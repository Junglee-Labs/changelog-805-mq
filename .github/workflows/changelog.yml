name: changelog

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  changelog:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/chloggen.yml
    with:
      skip-labels: 'skip-changelog,dependencies'
      skip-title-pattern: '^((chore|ci|test|docs)(\([^)]*\))?!?: |[Rr]evert)'
