name: release-notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: write-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          awk -v tag="## ${TAG}" '
            $0 == tag { found = 1; next }
            found && /<!-- previous-version -->/ { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [[ ! -s "${RUNNER_TEMP}/notes.md" ]]; then echo "No section for ${TAG} in CHANGELOG.md"; exit 1; fi
          gh release edit "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
