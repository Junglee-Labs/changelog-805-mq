name: prereleaser

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: chlog-update
        run: make chlog-update VERSION=${{ inputs.version }}
      - name: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${VERSION}"
          git add -A
          git commit -m "chore(release): ${VERSION}"
          git push origin "release/${VERSION}"
          gh pr create --base main --head "release/${VERSION}" --title "chore(release): ${VERSION}" --label skip-changelog \
            --body "Writes the ${VERSION} section to CHANGELOG.md from the .chloggen entries and deletes them. After merge, tag the merge commit ${VERSION}."
